name: Release Android APK

# Push a tag like v1.0.0 to build a signed APK and publish a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          export VERSION_NAME="${VERSION_NAME#v}"
          export VERSION_CODE="${{ github.run_number }}"
          npm run apk:release
          cp android/app/build/outputs/apk/release/app-release.apk "habitly-$VERSION_NAME.apk"
          # A fixed name too, so releases/latest/download/habitly.apk always gets the newest.
          cp android/app/build/outputs/apk/release/app-release.apk habitly.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" habitly-*.apk habitly.apk --title "Habitly ${{ github.ref_name }}" --generate-notes
